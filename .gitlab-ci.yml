stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_TLS_CERTDIR: "/certs"

# ─── TEST ────────────────────────────────────────────────────────────────────
# Jalankan unit test di semua MR, main, dan develop.
# glebarez/sqlite adalah pure-Go — tidak butuh CGO atau service DB eksternal.

test:
  stage: test
  image: golang:1.25-alpine
  script:
    - go mod download
    - go test -v -cover -race ./...
  coverage: '/coverage: \d+\.\d+% of statements/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ─── BUILD ───────────────────────────────────────────────────────────────────
# Build Docker image dan push ke GitLab Container Registry.
# Tag: :$CI_COMMIT_SHORT_SHA (immutable) + :latest (mutable, untuk rollback cepat).

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build
        --cache-from "$IMAGE_NAME:latest"
        -t "$IMAGE_NAME:$IMAGE_TAG"
        -t "$IMAGE_NAME:latest"
        .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── DEPLOY ──────────────────────────────────────────────────────────────────
# SSH ke VPS, pull image baru, restart hanya container app (postgres & redis
# tidak ikut restart). Butuh variabel berikut di Settings → CI/CD → Variables:
#
#   SSH_PRIVATE_KEY  — private key untuk akses SSH ke VPS        (Protected, Masked)
#   VPS_HOST         — IP atau hostname VPS                       (Protected)
#   VPS_USER         — user SSH, misal: ubuntu atau root          (Protected)
#   VPS_DEPLOY_PATH  — path project di VPS, misal: /opt/movie-service
#
# Pastikan public key sudah ada di ~/.ssh/authorized_keys di VPS.

deploy:
  stage: deploy
  image: alpine:3.21
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$VPS_USER@$VPS_HOST" "
        set -e

        echo '--- Login ke GitLab Registry ---'
        docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' '$CI_REGISTRY'

        echo '--- Pull image baru ---'
        docker pull '$IMAGE_NAME:$IMAGE_TAG'

        echo '--- Restart container app ---'
        cd '$VPS_DEPLOY_PATH'
        REGISTRY_IMAGE='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' \
          docker compose up -d --no-deps --remove-orphans app

        echo '--- Bersihkan image lama ---'
        docker image prune -f

        echo '--- Deploy selesai: $IMAGE_NAME:$IMAGE_TAG ---'
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build
  environment:
    name: production
    url: http://$VPS_HOST:7071
